<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Onboarding Splash</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
:root {
  --dg-color-text-high-emphasis: #000000;
  --dg-color-action-primary: #000000;
  --dg-color-action-secondary: #BFFF5E;
  --dg-color-action-on-primary-text: #FFFFFF;
  --dg-color-background-primary: #EEEEEE;
  --dg-color-background-secondary: #BFFF5E;
  --dg-radii-app: 28px;
  --dg-radii-inner: 20px;
  --dg-spacing-md: 16px;
  --dg-spacing-xl: 32px;
  --dg-spacing-xs: 8px;
  --dg-typography-heading-font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --dg-typography-body-font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --dg-type-hero-title-size: 34px;
  --dg-type-hero-title-weight: 900;
  --dg-type-hero-title-line-height: 40px;
  --dg-type-body-size: 16px;
  --dg-type-body-weight: 500;
  --dg-type-body-line-height: 24px;
  --dg-type-caption-size: 12px;
  --dg-type-caption-weight: 500;
  --dg-type-caption-line-height: 16px;
  --dg-type-button-label-size: 16px;
  --dg-type-button-label-weight: 700;
  --dg-type-button-label-line-height: 20px;
  --dg-mobile-layout-screen-margin: 16px;
}

:where(#root, #drawgle-export-root) h1,
:where(#root, #drawgle-export-root) h2,
:where(#root, #drawgle-export-root) h3,
:where(#root, #drawgle-export-root) h4,
:where(#root, #drawgle-export-root) h5,
:where(#root, #drawgle-export-root) h6 {
  font-family: var(--dg-typography-heading-font-family, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif);
}

:where(#root, #drawgle-export-root) button,
:where(#root, #drawgle-export-root) input,
:where(#root, #drawgle-export-root) textarea,
:where(#root, #drawgle-export-root) select {
  font-family: var(--dg-typography-body-font-family, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif);
}

.dg-bg-primary { background-color: var(--dg-color-background-primary); }

.dg-text-high { color: var(--dg-color-text-high-emphasis); }

.dg-action-primary {
  background-color: var(--dg-color-action-primary);
  color: var(--dg-color-action-on-primary-text);
}

.dg-shared-nav-clearance {
  padding-bottom: var(--dg-navigation-clearance, 0px) !important;
}

.dg-type-hero-title {
  font-family: var(--dg-typography-heading-font-family, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif);
  font-size: var(--dg-type-hero-title-size);
  font-weight: var(--dg-type-hero-title-weight);
  line-height: var(--dg-type-hero-title-line-height);
}

.dg-type-body {
  font-family: var(--dg-typography-body-font-family, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif);
  font-size: var(--dg-type-body-size);
  font-weight: var(--dg-type-body-weight);
  line-height: var(--dg-type-body-line-height);
}

.dg-type-caption {
  font-family: var(--dg-typography-body-font-family, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif);
  font-size: var(--dg-type-caption-size);
  font-weight: var(--dg-type-caption-weight);
  line-height: var(--dg-type-caption-line-height);
}

.dg-type-button-label {
  font-family: var(--dg-typography-body-font-family, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif);
  font-size: var(--dg-type-button-label-size);
  font-weight: var(--dg-type-button-label-weight);
  line-height: var(--dg-type-button-label-line-height);
}
html, body { margin: 0; min-height: 100%; }
body {
  font-family: var(--dg-typography-body-font-family, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif);
  background: var(--dg-color-background-primary, #ffffff);
  color: var(--dg-color-text-high-emphasis, #111827);
}
#drawgle-export-root {
  position: relative;
  min-height: 100vh;
  overflow-x: hidden;
  background: var(--dg-color-background-primary, #ffffff);
}
    </style>
  </head>
  <body>
    <div id="drawgle-export-root">
<div class="w-full min-h-screen dg-bg-primary dg-text-high flex flex-col relative overflow-x-hidden">
  <main class="relative flex h-screen min-h-screen flex-col overflow-hidden bg-[var(--dg-color-background-secondary)] px-[var(--dg-mobile-layout-screen-margin)] pt-[16px] dg-shared-nav-clearance">
    <div class="pointer-events-none absolute inset-0 shadow-[inset_0_0_48px_rgba(0,0,0,0.16)]"></div>

    <div class="relative z-10 flex min-h-[24px] items-center justify-between">
      <div class="flex items-center gap-[var(--dg-spacing-xs)]">
        <div class="flex h-[20px] w-[20px] items-center justify-center rounded-full border-[1.5px] border-black">
          <i data-lucide="sparkles" class="h-[12px] w-[12px]"></i>
        </div>
        <span class="dg-type-caption font-semibold uppercase tracking-[0.14em]">Neon Pulse</span>
      </div>
      <span class="dg-type-caption uppercase tracking-[0.16em] opacity-60">Digital banking</span>
    </div>

    <div class="relative flex min-h-0 flex-1 items-center justify-center overflow-visible" style="flex: 1 0 0%; height: 500.667px">
      <div class="pointer-events-none absolute left-1/2 top-1/2 h-[292px] w-[292px] -translate-x-1/2 -translate-y-[48%] rounded-full border-[1.5px] border-black/10 shadow-[inset_0_0_30px_rgba(0,0,0,0.08)]"></div>
      <div class="pointer-events-none absolute left-[5%] top-[20%] h-[56px] w-[56px] rounded-full border-[1.5px] border-black/20"></div>
      <div class="pointer-events-none absolute right-[4%] top-[13%] h-[12px] w-[12px] rounded-full bg-black"></div>
      <div class="pointer-events-none absolute bottom-[12%] left-[9%] h-[10px] w-[10px] rounded-full bg-black"></div>

      <div class="pointer-events-none absolute left-1/2 top-1/2 h-[190px] w-[250px] -translate-x-1/2 -translate-y-[42%] rotate-[-12deg] rounded-[var(--dg-radii-app)] bg-black/20 blur-[12px]"></div>

      <div class="pointer-events-none absolute left-[14%] top-[22%] h-[72px] w-[72px] rotate-[-18deg] rounded-full bg-[#101412] p-[7px] shadow-[0_12px_22px_rgba(0,0,0,0.22)]">
        <div class="flex h-full w-full items-center justify-center rounded-full border-[1.5px] border-[var(--dg-color-action-secondary)] bg-[#1c2820] text-[18px] font-black text-[var(--dg-color-action-secondary)]">
          $
        </div>
      </div>

      <div class="pointer-events-none absolute right-[9%] top-[19%] h-[78px] w-[78px] rotate-[14deg] rounded-full bg-[#101412] p-[var(--dg-spacing-xs)] shadow-[0_14px_24px_rgba(0,0,0,0.24)]">
        <div class="flex h-full w-full items-center justify-center rounded-full border-[1.5px] border-[var(--dg-color-action-secondary)] bg-[#d9ff8f]">
          <div class="h-[34px] w-[34px] rounded-full border-[3px] border-black/80"></div>
        </div>
      </div>

      <div class="pointer-events-none absolute left-1/2 top-1/2 z-10 h-[168px] w-[252px] -translate-x-1/2 -translate-y-[43%] rotate-[7deg] overflow-hidden rounded-[var(--dg-radii-inner)] border-[1.5px] border-black/80 bg-[linear-gradient(135deg,#1b251e_0%,#384b35_55%,#0b0e0b_100%)] p-[16px] shadow-[10px_16px_0_rgba(0,0,0,0.18),inset_0_0_0_1px_rgba(191,255,94,0.22)]">
        <div class="absolute inset-0 opacity-30 [background-image:linear-gradient(rgba(191,255,94,0.45)_1px,transparent_1px),linear-gradient(90deg,rgba(191,255,94,0.45)_1px,transparent_1px)] [background-size:18px_18px]"></div>
        <div class="relative flex items-start justify-between">
          <span class="text-[11px] font-black uppercase tracking-[0.18em] text-[var(--dg-color-action-secondary)]">NP / 01</span>
          <div class="h-[22px] w-[30px] rounded-[5px] border-[1.5px] border-[var(--dg-color-action-secondary)]/80 bg-[var(--dg-color-action-secondary)]/20"></div>
        </div>
        <div class="relative mt-[34px] flex items-end justify-between">
          <div>
            <div class="text-[10px] font-medium uppercase tracking-[0.14em] text-white/60">Digital balance</div>
            <div class="mt-[3px] text-[20px] font-black tracking-[-0.04em] text-white">$25,453</div>
          </div>
          <div class="flex h-[34px] w-[34px] items-center justify-center rounded-full bg-[var(--dg-color-action-secondary)] text-black">
            <i data-lucide="waves" class="h-[18px] w-[18px]"></i>
          </div>
        </div>
      </div>

      <div class="pointer-events-none absolute bottom-[15%] right-[12%] z-20 flex h-[54px] w-[54px] rotate-[18deg] items-center justify-center rounded-full bg-black shadow-[0_10px_18px_rgba(0,0,0,0.22)]">
        <div class="h-[27px] w-[27px] rounded-full border-[1.5px] border-[var(--dg-color-action-secondary)]"></div>
        <span class="absolute text-[11px] font-black text-[var(--dg-color-action-secondary)]">+</span>
      </div>

      <figure class="pointer-events-none absolute left-1/2 top-1/2 z-30 h-[310px] w-[310px] -translate-x-1/2 -translate-y-1/2 dg-asset-placeholder" role="img" aria-label="Abstract 3D digital banking elements like floating coins and a stylized credit card with neon textures"></figure>
    </div>

    <div class="relative z-10 shrink-0 pt-[var(--dg-spacing-xl)]">
      <div class="mb-[var(--dg-spacing-xs)] flex items-center gap-[var(--dg-spacing-xs)]">
        <span class="h-[8px] w-[8px] rounded-full bg-black"></span>
        <span class="dg-type-caption font-semibold uppercase tracking-[0.18em]">Banking, reimagined</span>
      </div>
      <h1 class="dg-type-hero-title max-w-[350px] tracking-[-0.045em]">
        Digital Banking<br>
        Made for Digital Users
      </h1>
      <p class="dg-type-body mt-[var(--dg-spacing-md)] max-w-[330px]">
        Spend, save, and send money in a banking experience built for the way you live online.
      </p>
    </div>

    <div class="relative z-10 shrink-0 pt-[var(--dg-spacing-xl)]" style="padding-top: var(--dg-radii-inner); padding-bottom: var(--dg-radii-inner)">
      <button type="button" class="dg-action-primary flex min-h-[56px] w-full items-center justify-between rounded-[var(--dg-radii-app)] px-[var(--dg-spacing-md)] pl-[24px] shadow-[0_8px_0_rgba(0,0,0,0.18)] transition-transform duration-200 ease-[cubic-bezier(0.34,1.56,0.64,1)] active:scale-[0.96]">
        <span class="dg-type-button-label">Get Started</span>
        <span class="flex h-[40px] w-[40px] items-center justify-center rounded-full bg-[var(--dg-color-action-on-primary-text)] text-[var(--dg-color-action-primary)]">
          <i data-lucide="arrow-up-right" class="h-[20px] w-[20px]"></i>
        </span>
      </button>
    </div>
  </main>
</div>
      
    </div>
    <script>
      function drawgleRepairLucideNames(root) {
  var icons = window.lucide && window.lucide.icons;
  if (!icons) return 0;
  var byLetters = null;
  var repaired = 0;
  (root || document).querySelectorAll("[data-lucide]").forEach(function (node) {
    var name = node.getAttribute("data-lucide") || "";
    var key = name.replace(/^([A-Z])|[\s\-_]+(\w)/g, function (match, first, next) { return next ? next.toUpperCase() : first.toLowerCase(); });
    key = key.charAt(0).toUpperCase() + key.slice(1);
    if (icons[key]) return;
    if (!byLetters) {
      byLetters = {};
      Object.keys(icons).forEach(function (iconKey) { byLetters[iconKey.toLowerCase()] = iconKey; });
    }
    var match = byLetters[name.replace(/[^a-z0-9]/gi, "").toLowerCase()];
    if (match) {
      node.setAttribute("data-lucide", match);
      repaired += 1;
    }
  });
  return repaired;
}
      if (window.lucide && typeof window.lucide.createIcons === "function") { drawgleRepairLucideNames(); window.lucide.createIcons(); }
    </script>
  </body>
</html>
