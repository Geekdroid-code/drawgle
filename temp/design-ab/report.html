-type-button-label-line-height);\n}\n\n#root {\n  --dg-preview-background: var(--dg-color-background-primary, #ffffff);\n  background: var(--dg-preview-background);\n  font-family: var(--dg-typography-body-font-family, -apple-system, BlinkMacSystemFont, \"Segoe UI\", sans-serif);\n}\n\n:where(#root, #drawgle-export-root) h1,\n:where(#root, #drawgle-export-root) h2,\n:where(#root, #drawgle-export-root) h3,\n:where(#root, #drawgle-export-root) h4,\n:where(#root, #drawgle-export-root) h5,\n:where(#root, #drawgle-export-root) h6 {\n  font-family: var(--dg-typography-heading-font-family, -apple-system, BlinkMacSystemFont, \"Segoe UI\", sans-serif);\n}\n\n:where(#root, #drawgle-export-root) button,\n:where(#root, #drawgle-export-root) input,\n:where(#root, #drawgle-export-root) textarea,\n:where(#root, #drawgle-export-root) select {\n  font-family: var(--dg-typography-body-font-family, -apple-system, BlinkMacSystemFont, \"Segoe UI\", sans-serif);\n}\n\n.dg-bg-primary { background-color: var(--dg-color-background-primary); }\n.dg-bg-secondary { background-color: var(--dg-color-background-secondary); }\n.dg-surface-card { background-color: var(--dg-color-surface-card); }\n.dg-surface-bottom-sheet { background-color: var(--dg-color-surface-bottom-sheet); }\n.dg-surface-modal { background-color: var(--dg-color-surface-modal); }\n.dg-text-high { color: var(--dg-color-text-high-emphasis); }\n.dg-text-medium { color: var(--dg-color-text-medium-emphasis); }\n.dg-text-low { color: var(--dg-color-text-low-emphasis); }\n.dg-action-primary {\n  background-color: var(--dg-color-action-primary);\n  color: var(--dg-color-action-on-primary-text);\n}\n.dg-action-secondary { background-color: var(--dg-color-action-secondary); }\n.dg-gradient-app-background { background-image: var(--dg-gradient-app-background); }\n.dg-gradient-action-primary {\n  background-image: var(--dg-gradient-action-primary);\n  color: var(--dg-color-action-on-primary-text);\n}\n.dg-gradient-surface-highlight { background-image: var(--dg-gradient-surface-highlight); }\n.dg-gradient-accent-ring { background-image: var(--dg-gradient-accent-ring); }\n.dg-border-divider { border-color: var(--dg-color-border-divider); }\n.dg-border-focused { border-color: var(--dg-color-border-focused); }\n.dg-status-success { color: var(--dg-color-status-success-foreground); background-color: var(--dg-color-status-success-surface); border-color: var(--dg-color-status-success-border); }\n.dg-status-warning { color: var(--dg-color-status-warning-foreground); background-color: var(--dg-color-status-warning-surface); border-color: var(--dg-color-status-warning-border); }\n.dg-status-danger { color: var(--dg-color-status-danger-foreground); background-color: var(--dg-color-status-danger-surface); border-color: var(--dg-color-status-danger-border); }\n.dg-status-info { color: var(--dg-color-status-info-foreground); background-color: var(--dg-color-status-info-surface); border-color: var(--dg-color-status-info-border); }\n.dg-radius-app { border-radius: var(--dg-radii-app); }\n.dg-radius-inner { border-radius: var(--dg-radii-inner); }\n.dg-radius-pill { border-radius: var(--dg-radii-pill); }\n.dg-radius-inset-xxs { border-radius: var(--dg-radii-inset-xxs, var(--dg-radii-inner)); }\n.dg-radius-inset-xs { border-radius: var(--dg-radii-inset-xs, var(--dg-radii-inner)); }\n.dg-radius-inset-sm { border-radius: var(--dg-radii-inset-sm, var(--dg-radii-inner)); }\n.dg-radius-inset-md { border-radius: var(--dg-radii-inset-md, var(--dg-radii-inner)); }\n.dg-radius-inset-lg { border-radius: var(--dg-radii-inset-lg, var(--dg-radii-inner)); }\n.dg-shared-nav-clearance {\n  padding-bottom: var(--dg-navigation-clearance, 0px) !important;\n}\n.dg-asset-placeholder {\n  display: flex;\n  align-items: center;\n  justify-content: center;\n  overflow: hidden;\n  background-color: var(--dg-color-background-secondary, #f5f5f5);\n  color: var(--dg-color-text-medium-emphasis, #6b7280);\n  box-shadow: inset 0 0 0 1px var(--dg-color-border-divider, #e5e7eb);\n  font-weight: 600;\n}\n.dg-shadow-surface { box-shadow: var(--dg-shadows-surface); }\n.dg-shadow-overlay { box-shadow: var(--dg-shadows-overlay); }\n.dg-screen-padding { padding-left: var(--dg-mobile-layout-screen-margin); padding-right: var(--dg-mobile-layout-screen-margin); }\n.dg-section-gap { gap: var(--dg-mobile-layout-section-gap); }\n.dg-element-gap { gap: var(--dg-mobile-layout-element-gap); }\n\n.dg-type-nav-title {\n  font-family: var(--dg-typography-heading-font-family, -apple-system, BlinkMacSystemFont, \"Segoe UI\", sans-serif);\n  font-size: var(--dg-type-nav-title-size);\n  font-weight: var(--dg-type-nav-title-weight);\n  line-height: var(--dg-type-nav-title-line-height);\n}\n\n.dg-type-screen-title {\n  font-family: var(--dg-typography-heading-font-family, -apple-system, BlinkMacSystemFont, \"Segoe UI\", sans-serif);\n  font-size: var(--dg-type-screen-title-size);\n  font-weight: var(--dg-type-screen-title-weight);\n  line-height: var(--dg-type-screen-title-line-height);\n}\n\n.dg-type-hero-title {\n  font-family: var(--dg-typography-heading-font-family, -apple-system, BlinkMacSystemFont, \"Segoe UI\", sans-serif);\n  font-size: var(--dg-type-hero-title-size);\n  font-weight: var(--dg-type-hero-title-weight);\n  line-height: var(--dg-type-hero-title-line-height);\n}\n\n.dg-type-section-title {\n  font-family: var(--dg-typography-heading-font-family, -apple-system, BlinkMacSystemFont, \"Segoe UI\", sans-serif);\n  font-size: var(--dg-type-section-title-size);\n  font-weight: var(--dg-type-section-title-weight);\n  line-height: var(--dg-type-section-title-line-height);\n}\n\n.dg-type-metric-value {\n  font-family: var(--dg-typography-body-font-family, -apple-system, BlinkMacSystemFont, \"Segoe UI\", sans-serif);\n  font-size: var(--dg-type-metric-value-size);\n  font-weight: var(--dg-type-metric-value-weight);\n  line-height: var(--dg-type-metric-value-line-height);\n}\n\n.dg-type-body {\n  font-family: var(--dg-typography-body-font-family, -apple-system, BlinkMacSystemFont, \"Segoe UI\", sans-serif);\n  font-size: var(--dg-type-body-size);\n  font-weight: var(--dg-type-body-weight);\n  line-height: var(--dg-type-body-line-height);\n}\n\n.dg-type-supporting {\n  font-family: var(--dg-typography-body-font-family, -apple-system, BlinkMacSystemFont, \"Segoe UI\", sans-serif);\n  font-size: var(--dg-type-supporting-size);\n  font-weight: var(--dg-type-supporting-weight);\n  line-height: var(--dg-type-supporting-line-height);\n}\n\n.dg-type-caption {\n  font-family: var(--dg-typography-body-font-family, -apple-system, BlinkMacSystemFont, \"Segoe UI\", sans-serif);\n  font-size: var(--dg-type-caption-size);\n  font-weight: var(--dg-type-caption-weight);\n  line-height: var(--dg-type-caption-line-height);\n}\n\n.dg-type-button-label {\n  font-family: var(--dg-typography-body-font-family, -apple-system, BlinkMacSystemFont, \"Segoe UI\", sans-serif);\n  font-size: var(--dg-type-button-label-size);\n  font-weight: var(--dg-type-button-label-weight);\n  line-height: var(--dg-type-button-label-line-height);\n}";
const FONT_LINKS = "";
const SAMPLES = JSON.parse(document.getElementById('samples').textContent);

const frameDoc = (html) => `<!doctype html><html><head><meta charset="utf-8">
<script src="https://cdn.tailwindcss.com"><\/script>
${FONT_LINKS}
<style>${TOKEN_CSS}
  html,body { margin:0; padding:0; }
  #root { width:390px; min-height:844px; overflow-x:hidden; }
</style></head><body><div id="root">${html}</div></body></html>`;

const measure = (win) => win.eval("(() => {\n  const TOLERANCE = 2;\n  const MIN_TOUCH = 44;\n  const findings = [];\n\n  const label = (el) => {\n    if (el.dataset && el.dataset.drawgleId) return el.dataset.drawgleId;\n    const cls = (el.getAttribute('class') || '').split(/\\s+/).filter(Boolean).slice(0, 2).join('.');\n    return el.tagName.toLowerCase() + (cls ? '.' + cls : '');\n  };\n\n  const text = (el) => (el.textContent || '').replace(/\\s+/g, ' ').trim();\n\n  const root = document.querySelector('#root') || document.body;\n  const all = Array.from(root.querySelectorAll('*'));\n\n  // 1. Content taller than the box holding it. This is the card whose text\n  //    escapes through its own rounded corner.\n  for (const el of all) {\n    const style = getComputedStyle(el);\n    if (style.overflowY === 'auto' || style.overflowY === 'scroll') continue;\n    if (style.display === 'inline') continue;\n    const over = el.scrollHeight - el.clientHeight;\n    if (el.clientHeight > 0 && over > TOLERANCE) {\n      findings.push({\n        code: 'content_overflows_container',\n        target: label(el),\n        amountPx: Math.round(over),\n        detail: 'Content is ' + Math.round(over) + 'px taller than its container (' + el.scrollHeight + 'px in ' + el.clientHeight + 'px).',\n      });\n    }\n  }\n\n  // 2. Anything wider than the frame. Catches fixed widths and rails that do\n  //    not scroll.\n  for (const el of all) {\n    const style = getComputedStyle(el);\n    if (style.overflowX === 'auto' || style.overflowX === 'scroll') continue;\n    const over = el.scrollWidth - el.clientWidth;\n    if (el.clientWidth > 0 && over > TOLERANCE) {\n      findings.push({\n        code: 'horizontal_overflow',\n        target: label(el),\n        amountPx: Math.round(over),\n        detail: 'Content is ' + Math.round(over) + 'px wider than its container.',\n      });\n    }\n  }\n\n  // 3. Text visually cut off, whether by truncation or by a box too small.\n  for (const el of all) {\n    if (el.children.length > 0) continue;\n    const content = text(el);\n    if (!content) continue;\n    const cut = el.scrollWidth - el.clientWidth;\n    if (el.clientWidth > 0 && cut > TOLERANCE) {\n      findings.push({\n        code: 'text_clipped',\n        target: label(el),\n        amountPx: Math.round(cut),\n        detail: JSON.stringify(content.slice(0, 40)) + ' is clipped by ' + Math.round(cut) + 'px.',\n      });\n    }\n  }\n\n  // 4. Controls too small to tap.\n  for (const el of root.querySelectorAll('button, a, [role=\"button\"], [role=\"tab\"], input, select')) {\n    const rect = el.getBoundingClientRect();\n    if (rect.width === 0 && rect.height === 0) continue;\n    const smallest = Math.min(rect.width, rect.height);\n    if (smallest > 0 && smallest < MIN_TOUCH - TOLERANCE) {\n      findings.push({\n        code: 'undersized_touch_target',\n        target: label(el),\n        amountPx: Math.round(smallest),\n        detail: 'Control measures ' + Math.round(rect.width) + 'x' + Math.round(rect.height) + 'px; the minimum is ' + MIN_TOUCH + 'px.',\n      });\n    }\n  }\n\n  // 5. Regions occupying real space with nothing rendered in them.\n  for (const el of all) {\n    const rect = el.getBoundingClientRect();\n    if (rect.height < 120 || rect.width < 80) continue;\n    if (text(el)) continue;\n    if (el.querySelector('img, svg, canvas, video, [data-asset-slot], i[data-lucide]')) continue;\n    const style = getComputedStyle(el);\n    const painted = style.backgroundImage !== 'none'\n      || (style.backgroundColor && style.backgroundColor !== 'rgba(0, 0, 0, 0)');\n    if (!painted) continue;\n    findings.push({\n      code: 'empty_visual_region',\n      target: label(el),\n      amountPx: Math.round(rect.height),\n      detail: 'A ' + Math.round(rect.width) + 'x' + Math.round(rect.height) + 'px painted region contains no text, media, or icon.',\n    });\n  }\n\n  // Deduplicate: one finding per element per code, worst offender first.\n  const seen = new Set();\n  const deduped = [];\n  for (const finding of findings.sort((a, b) => b.amountPx - a.amountPx)) {\n    const key = finding.code + '|' + finding.target;\n    if (seen.has(key)) continue;\n    seen.add(key);\n    deduped.push(finding);\n  }\n\n  return {\n    measuredAt: new Date().toISOString(),\n    viewport: { width: window.innerWidth, height: window.innerHeight },\n    documentScrollWidth: document.documentElement.scrollWidth,\n    findings: deduped,\n  };\n})()");

const waitForStyles = (win) => new Promise((done) => {
  let tries = 0;
  const probe = () => {
    tries += 1;
    const el = win.document.querySelector('#root .flex, #root [class*="p-"], #root div');
    const ready = el && win.getComputedStyle(el).display !== 'inline';
    if (ready || tries > 60) return setTimeout(done, 350);
    setTimeout(probe, 100);
  };
  probe();
});

(async () => {
  const results = [];
  const framesEl = document.getElementById('frames');

  for (const sample of SAMPLES) {
    const wrap = document.createElement('div');
    wrap.className = 'frame';
    wrap.innerHTML = '<h3>' + sample.arm + ' #' + sample.index + '</h3>';
    const iframe = document.createElement('iframe');
    wrap.appendChild(iframe);
    framesEl.appendChild(wrap);

    if (sample.error) { results.push({ ...sample, report: null }); continue; }

    await new Promise((ready) => {
      iframe.onload = ready;
      iframe.srcdoc = frameDoc(sample.html);
    });
    await waitForStyles(iframe.contentWindow);
    let report = null;
    try { report = measure(iframe.contentWindow); } catch (e) { report = { findings: [], error: String(e) }; }
    results.push({ ...sample, report });
    wrap.querySelector('h3').textContent += ' — ' + (report.findings ? report.findings.length : '?') + ' findings';
  }

  const WEIGHT = { content_overflows_container: 3, text_clipped: 3, horizontal_overflow: 2, empty_visual_region: 1, undersized_touch_target: 1 };
  const arms = ['design-brain-on', 'design-brain-off'];
  const stats = {};
  for (const arm of arms) {
    const rows = results.filter((r) => r.arm === arm);
    const ok = rows.filter((r) => r.report && !r.error);
    const counts = (code) => ok.map((r) => r.report.findings.filter((f) => f.code === code).length);
    const mean = (xs) => xs.length ? xs.reduce((a, b) => a + b, 0) / xs.length : 0;
    stats[arm] = {
      samples: rows.length,
      failures: rows.filter((r) => r.error).length,
      overflow: mean(counts('content_overflows_container')),
      clipped: mean(counts('text_clipped')),
      horizontal: mean(counts('horizontal_overflow')),
      empty: mean(counts('empty_visual_region')),
      touch: mean(counts('undersized_touch_target')),
      weighted: mean(ok.map((r) => r.report.findings.reduce((t, f) => t + (WEIGHT[f.code] || 1), 0))),
      chars: mean(ok.map((r) => r.html.length)),
    };
  }

  const cell = (a, b, lowerIsBetter = true) => {
    if (Math.abs(a - b) < 0.01) return ['<td>' + a.toFixed(2) + '</td>', '<td>' + b.toFixed(2) + '</td>'];
    const aWins = lowerIsBetter ? a < b : a > b;
    return [
      '<td class="' + (aWins ? 'win' : 'lose') + '">' + a.toFixed(2) + '</td>',
      '<td class="' + (aWins ? 'lose' : 'win') + '">' + b.toFixed(2) + '</td>',
    ];
  };

  const rows = [
    ['Generation failures', stats[arms[0]].failures, stats[arms[1]].failures],
    ['Content overflow / screen', stats[arms[0]].overflow, stats[arms[1]].overflow],
    ['Clipped text / screen', stats[arms[0]].clipped, stats[arms[1]].clipped],
    ['Horizontal overflow / screen', stats[arms[0]].horizontal, stats[arms[1]].horizontal],
    ['Empty painted region / screen', stats[arms[0]].empty, stats[arms[1]].empty],
    ['Undersized controls / screen', stats[arms[0]].touch, stats[arms[1]].touch],
    ['WEIGHTED FAULT SCORE', stats[arms[0]].weighted, stats[arms[1]].weighted],
  ];

  document.getElementById('summary').innerHTML =
    '<table><tr><th>Metric (lower is better)</th><th>design brain ON</th><th>design brain OFF</th></tr>' +
    rows.map(([label, a, b]) => {
      const [ca, cb] = cell(Number(a), Number(b));
      return '<tr><td>' + label + '</td>' + ca + cb + '</tr>';
    }).join('') +
    '</table>';

  document.getElementById('detail').innerHTML = '<h2>All findings</h2><pre>' +
    results.map((r) => r.arm + ' #' + r.index + (r.error ? '  ERROR: ' + r.error :
      '\n' + (r.report.findings.length ? r.report.findings.map((f) => '   [' + f.code + '] ' + f.target + ' — ' + f.detail).join('\n') : '   clean'))
    ).join('\n\n') + '</pre>';

  window.__abStats = stats;
  window.__abDone = true;
})();
</script>
</body>
</html>
