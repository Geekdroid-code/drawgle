<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calorie Counter Dashboard</title>
    <script>
      window.tailwind = window.tailwind || {};
      window.tailwind.config = {
        theme: {
          extend: {
            borderRadius: {
              lg: "var(--radius, var(--dg-radii-app))"
            }
          }
        }
      };
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link id="drawgle-google-font" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap">
    <style>
:root {
  --dg-color-text-low-emphasis: #8B8B8F;
  --dg-color-text-high-emphasis: #000000;
  --dg-color-text-medium-emphasis: #8E8E93;
  --dg-color-action-primary: #FFF176;
  --dg-color-border-divider: #F0F0F0;
  --dg-color-border-focused: #C5E9F1;
  --dg-color-surface-card: #FFFFFF;
  --dg-color-background-primary: #FFFFFF;
  --dg-color-background-secondary: #F8F9FA;
  --dg-radii-app: 32px;
  --dg-radii-pill: 9999px;
  --dg-sizing-icon-standard: 24px;
  --dg-sizing-bottom-nav-height: 72px;
  --dg-shadows-overlay: 0px 8px 24px rgba(0, 0, 0, 0.08);
  --dg-shadows-surface: 0px 4px 12px rgba(0, 0, 0, 0.03);
  --dg-spacing-md: 16px;
  --dg-spacing-sm: 12px;
  --dg-spacing-xs: 8px;
  --dg-typography-heading-font-family: Inter, system-ui, sans-serif;
  --dg-typography-body-font-family: Inter, system-ui, sans-serif;
  --dg-type-hero-title-size: 42px;
  --dg-type-hero-title-weight: 800;
  --dg-type-hero-title-line-height: 48px;
  --dg-type-section-title-size: 18px;
  --dg-type-section-title-weight: 600;
  --dg-type-section-title-line-height: 24px;
  --dg-type-metric-value-size: 24px;
  --dg-type-metric-value-weight: 700;
  --dg-type-metric-value-line-height: 28px;
  --dg-type-body-size: 16px;
  --dg-type-body-weight: 400;
  --dg-type-body-line-height: 22px;
  --dg-type-supporting-size: 14px;
  --dg-type-supporting-weight: 500;
  --dg-type-supporting-line-height: 18px;
  --dg-type-caption-size: 12px;
  --dg-type-caption-weight: 400;
  --dg-type-caption-line-height: 16px;
  --dg-mobile-layout-element-gap: 16px;
  --dg-mobile-layout-section-gap: 24px;
  --dg-mobile-layout-safe-area-top: 16px;
  --dg-mobile-layout-screen-margin: 24px;
  --dg-mobile-layout-safe-area-bottom: 16px;
  --radius: var(--dg-radii-app, 16px);
}

:where(#root, #drawgle-export-root) h1,
:where(#root, #drawgle-export-root) h2,
:where(#root, #drawgle-export-root) h3,
:where(#root, #drawgle-export-root) h4,
:where(#root, #drawgle-export-root) h5,
:where(#root, #drawgle-export-root) h6 {
  font-family: var(--dg-typography-heading-font-family, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif);
}

:where(#root, #drawgle-export-root) button,
:where(#root, #drawgle-export-root) input,
:where(#root, #drawgle-export-root) textarea,
:where(#root, #drawgle-export-root) select {
  font-family: var(--dg-typography-body-font-family, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif);
}

.dg-bg-primary { background-color: var(--dg-color-background-primary); }

.dg-bg-secondary { background-color: var(--dg-color-background-secondary); }

.dg-surface-card { background-color: var(--dg-color-surface-card); }

.dg-text-high { color: var(--dg-color-text-high-emphasis); }

.dg-shared-nav-clearance {
  padding-bottom: var(--dg-navigation-clearance, 0px) !important;
}

.dg-type-hero-title {
  font-family: var(--dg-typography-heading-font-family, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif);
  font-size: var(--dg-type-hero-title-size);
  font-weight: var(--dg-type-hero-title-weight);
  line-height: var(--dg-type-hero-title-line-height);
}

.dg-type-section-title {
  font-family: var(--dg-typography-heading-font-family, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif);
  font-size: var(--dg-type-section-title-size);
  font-weight: var(--dg-type-section-title-weight);
  line-height: var(--dg-type-section-title-line-height);
}

.dg-type-metric-value {
  font-family: var(--dg-typography-body-font-family, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif);
  font-size: var(--dg-type-metric-value-size);
  font-weight: var(--dg-type-metric-value-weight);
  line-height: var(--dg-type-metric-value-line-height);
}

.dg-type-body {
  font-family: var(--dg-typography-body-font-family, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif);
  font-size: var(--dg-type-body-size);
  font-weight: var(--dg-type-body-weight);
  line-height: var(--dg-type-body-line-height);
}

.dg-type-supporting {
  font-family: var(--dg-typography-body-font-family, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif);
  font-size: var(--dg-type-supporting-size);
  font-weight: var(--dg-type-supporting-weight);
  line-height: var(--dg-type-supporting-line-height);
}

.dg-type-caption {
  font-family: var(--dg-typography-body-font-family, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif);
  font-size: var(--dg-type-caption-size);
  font-weight: var(--dg-type-caption-weight);
  line-height: var(--dg-type-caption-line-height);
}
html, body { margin: 0; min-height: 100%; }
body {
  font-family: var(--dg-typography-body-font-family, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif);
  background: var(--dg-color-background-primary, #ffffff);
  color: var(--dg-color-text-high-emphasis, #111827);
}
#drawgle-export-root {
  position: relative;
  min-height: 100vh;
  overflow-x: hidden;
  background: var(--dg-color-background-primary, #ffffff);
}
    </style>
  </head>
  <body>
    <div id="drawgle-export-root">
<div class="w-full min-h-screen dg-bg-primary dg-text-high flex flex-col relative overflow-x-hidden">
  <!-- Header -->
  <header class="flex items-center justify-between px-[var(--dg-mobile-layout-screen-margin)] pt-[var(--dg-mobile-layout-safe-area-top)] h-[64px]">
    <div class="flex items-center gap-[var(--dg-spacing-xs)]">
      <div class="w-[40px] h-[40px] rounded-[var(--dg-radii-pill)] overflow-hidden bg-slate-200"><img src="https://pub-7c8c3c7444724a39ba3eeb8accbbca4a.r2.dev/visual-assets/99c05292-305d-448e-aebb-3acb069cdf8f/asset.webp" alt="Hailey, a friendly young woman" width="1024" height="1024" loading="lazy" decoding="async" class="w-full h-full object-cover" style="object-fit: cover; object-position: center left;"></div>
      <span class="dg-type-body font-semibold">Hello, Hailey!</span>
    </div>
    <div class="flex items-center gap-[var(--dg-spacing-sm)]">
      <button class="w-[48px] h-[48px] flex items-center justify-center rounded-[var(--dg-radii-pill)] dg-bg-secondary border border-[var(--dg-color-border-divider)]">
        <i data-lucide="search" class="w-[var(--dg-sizing-icon-standard)] h-[var(--dg-sizing-icon-standard)]"></i>
      </button>
      <button class="w-[48px] h-[48px] flex items-center justify-center rounded-[var(--dg-radii-pill)] dg-bg-secondary border border-[var(--dg-color-border-divider)] relative">
        <i data-lucide="bell" class="w-[var(--dg-sizing-icon-standard)] h-[var(--dg-sizing-icon-standard)]"></i>
        <span class="absolute top-3 right-3 w-[8px] h-[8px] bg-red-400 rounded-full border-2 border-white"></span>
      </button>
    </div>
  </header>

  <!-- Main Scroll Content -->
  <main class="flex-1 overflow-y-auto dg-shared-nav-clearance">
    <div class="px-[var(--dg-mobile-layout-screen-margin)] py-[var(--dg-mobile-layout-section-gap)] space-y-[var(--dg-mobile-layout-section-gap)]">
      
      <!-- Progress Hero Card -->
      <section class="bg-[var(--dg-color-border-focused)] rounded-[var(--dg-radii-app)] p-[var(--dg-spacing-md)] flex flex-col justify-between h-[180px]">
        <div class="flex items-center gap-[var(--dg-spacing-xs)]">
          <div class="w-[28px] h-[28px] rounded-lg bg-white flex items-center justify-center shadow-sm">
            <i data-lucide="compass" class="w-4 h-4 text-[var(--dg-color-border-focused)]"></i>
          </div>
          <span class="dg-type-supporting font-semibold">Your Progress</span>
        </div>

        <div class="flex items-end justify-between">
          <div class="flex flex-col">
            <span class="dg-type-hero-title leading-none">91%</span>
            <div class="flex items-center gap-1 mt-1 opacity-70">
              <span class="dg-type-caption font-semibold">19 September</span>
              <i data-lucide="chevron-down" class="w-3 h-3"></i>
            </div>
          </div>

          <!-- Circular Gauge -->
          <div class="relative w-[100px] h-[100px] flex items-center justify-center">
            <svg class="absolute inset-0 w-full h-full -rotate-90">
              <circle cx="50" cy="50" r="44" stroke="rgba(255,255,255,0.3)" stroke-width="8" fill="transparent"></circle>
              <circle cx="50" cy="50" r="44" stroke="white" stroke-width="8" fill="transparent" stroke-dasharray="276" stroke-dashoffset="25" stroke-linecap="round"></circle>
            </svg>
            <div class="text-center">
              <div class="dg-type-body font-bold leading-none">1350</div>
              <div class="dg-type-caption text-[10px] uppercase tracking-wider opacity-70">Calories</div>
            </div>
            <div class="absolute top-0 right-0 w-4 h-4 bg-yellow-300 border-2 border-white rounded-full flex items-center justify-center">
              <div class="w-1.5 h-1.5 bg-white rounded-full"></div>
            </div>
          </div>
        </div>
      </section>

      <!-- Metrics Grid -->
      <section class="grid grid-cols-2 gap-[var(--dg-mobile-layout-element-gap)]">
        <!-- Weight Card -->
        <div class="dg-surface-card border border-[var(--dg-color-border-divider)] rounded-[var(--dg-radii-app)] p-[var(--dg-spacing-md)] shadow-[var(--dg-shadows-surface)]">
          <div class="flex items-center justify-between mb-4">
            <span class="dg-type-supporting text-[var(--dg-color-text-medium-emphasis)] font-medium">Current<br>Weight</span>
            <div class="w-8 h-8 rounded-full dg-bg-secondary flex items-center justify-center">
              <i data-lucide="zap" class="w-4 h-4"></i>
            </div>
          </div>
          <div class="flex items-baseline gap-1">
            <span class="dg-type-metric-value">78.5</span>
            <span class="dg-type-caption opacity-50">Kg</span>
          </div>
          <div class="flex items-center gap-1 mt-2">
            <i data-lucide="arrow-down-right" class="w-3 h-3 text-red-400"></i>
            <span class="dg-type-caption text-red-400 font-semibold">3 Kg (-3.8%)</span>
          </div>
        </div>

        <!-- Calories Card -->
        <div class="dg-surface-card border border-[var(--dg-color-border-divider)] rounded-[var(--dg-radii-app)] p-[var(--dg-spacing-md)] shadow-[var(--dg-shadows-surface)] flex flex-col">
          <div class="flex items-center justify-between mb-4">
            <span class="dg-type-supporting text-[var(--dg-color-text-medium-emphasis)] font-medium">Today's<br>Calories</span>
            <div class="w-8 h-8 rounded-full dg-bg-secondary flex items-center justify-center">
              <i data-lucide="pie-chart" class="w-4 h-4"></i>
            </div>
          </div>
          <div class="flex items-baseline gap-1">
            <span class="dg-type-metric-value">1278</span>
            <span class="dg-type-caption opacity-50">Kcal</span>
          </div>
          <div class="flex items-center gap-1 mt-2">
            <i data-lucide="clock" class="w-3 h-3 text-[var(--dg-color-text-low-emphasis)]"></i>
            <span class="dg-type-caption text-[var(--dg-color-text-low-emphasis)]">5.6%</span>
          </div>
          <!-- Sparkline representation -->
          <div class="mt-auto pt-2 h-[20px] flex items-end gap-1">
            <div class="flex-1 h-[40%] bg-slate-100 rounded-full"></div>
            <div class="flex-1 h-[60%] bg-slate-100 rounded-full"></div>
            <div class="flex-1 h-[80%] bg-slate-100 rounded-full"></div>
            <div class="flex-1 h-[50%] bg-slate-200 rounded-full"></div>
            <div class="flex-1 h-[100%] bg-blue-200 rounded-full"></div>
            <div class="flex-1 h-[70%] bg-slate-100 rounded-full"></div>
          </div>
        </div>
      </section>

      <!-- Meal Card (Breakfast) -->
      <section class="bg-[#D4EDC9] rounded-[var(--dg-radii-app)] p-[var(--dg-spacing-md)]">
        <div class="flex items-center justify-between mb-6">
          <div class="flex items-center gap-[var(--dg-spacing-sm)]">
            <div class="w-10 h-10 rounded-full bg-white flex items-center justify-center">
              <i data-lucide="sun" class="w-5 h-5 text-[#D4EDC9]"></i>
            </div>
            <div>
              <h3 class="dg-type-section-title leading-none">Breakfast</h3>
              <p class="dg-type-caption font-medium opacity-60">350 calories</p>
            </div>
          </div>
          <button class="w-[40px] h-[40px] rounded-[var(--dg-radii-pill)] bg-white flex items-center justify-center shadow-sm">
            <i data-lucide="plus" class="w-5 h-5"></i>
          </button>
        </div>

        <div class="grid grid-cols-4 gap-2">
          <div class="text-center">
            <p class="dg-type-caption opacity-60 mb-1">Proteins</p>
            <p class="dg-type-body font-bold">62.5</p>
          </div>
          <div class="text-center">
            <p class="dg-type-caption opacity-60 mb-1">Fats</p>
            <p class="dg-type-body font-bold">23.6</p>
          </div>
          <div class="text-center">
            <p class="dg-type-caption opacity-60 mb-1">Carbs</p>
            <p class="dg-type-body font-bold">45.7</p>
          </div>
          <div class="text-center">
            <p class="dg-type-caption opacity-60 mb-1">RDC</p>
            <p class="dg-type-body font-bold">14%</p>
          </div>
        </div>

        <div class="flex items-center justify-between mt-6">
          <div class="flex items-center gap-1 bg-white/40 px-3 py-1 rounded-[var(--dg-radii-pill)]">
            <span class="dg-type-caption font-bold">Today</span>
            <i data-lucide="chevron-down" class="w-3 h-3"></i>
          </div>
          <button class="w-8 h-8 rounded-full bg-white/40 flex items-center justify-center">
            <i data-lucide="edit-3" class="w-4 h-4"></i>
          </button>
        </div>
      </section>
    </div>
  </main>

  <!-- Floating Navigation -->
  <div class="fixed bottom-[var(--dg-mobile-layout-safe-area-bottom)] left-0 right-0 flex justify-center z-50 pointer-events-none">
    <nav class="pointer-events-auto flex items-center gap-[var(--dg-spacing-md)] px-[var(--dg-spacing-md)] h-[var(--dg-sizing-bottom-nav-height)] bg-white border border-[var(--dg-color-border-divider)] rounded-[var(--dg-radii-pill)] shadow-[var(--dg-shadows-overlay)]" style="padding-right: var(--dg-spacing-sm); padding-left: var(--dg-spacing-sm)">
      <button class="w-[48px] h-[48px] flex items-center justify-center rounded-[var(--dg-radii-pill)] bg-[var(--dg-color-action-primary)]">
        <i data-lucide="user" class="w-6 h-6"></i>
      </button>
      <button class="w-[48px] h-[48px] flex items-center justify-center rounded-[var(--dg-radii-pill)] hover:bg-slate-50">
        <i data-lucide="calendar" class="w-6 h-6 opacity-40"></i>
      </button>
      <button class="w-[48px] h-[48px] flex items-center justify-center rounded-[var(--dg-radii-pill)] hover:bg-slate-50">
        <i data-lucide="layout-grid" class="w-6 h-6 opacity-40"></i>
      </button>
    </nav>
  </div>
</div>
      
    </div>
    <script>
      function drawgleRepairLucideNames(root) {
  var icons = window.lucide && window.lucide.icons;
  if (!icons) return 0;
  var byLetters = null;
  var repaired = 0;
  (root || document).querySelectorAll("[data-lucide]").forEach(function (node) {
    var name = node.getAttribute("data-lucide") || "";
    var key = name.replace(/^([A-Z])|[\s\-_]+(\w)/g, function (match, first, next) { return next ? next.toUpperCase() : first.toLowerCase(); });
    key = key.charAt(0).toUpperCase() + key.slice(1);
    if (icons[key]) return;
    if (!byLetters) {
      byLetters = {};
      Object.keys(icons).forEach(function (iconKey) { byLetters[iconKey.toLowerCase()] = iconKey; });
    }
    var match = byLetters[name.replace(/[^a-z0-9]/gi, "").toLowerCase()];
    if (match) {
      node.setAttribute("data-lucide", match);
      repaired += 1;
    }
  });
  return repaired;
}
      if (window.lucide && typeof window.lucide.createIcons === "function") { drawgleRepairLucideNames(); window.lucide.createIcons(); }
    </script>
  </body>
</html>
