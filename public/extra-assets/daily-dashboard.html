<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Daily Dashboard</title>
    <script>
      window.tailwind = window.tailwind || {};
      window.tailwind.config = {
        theme: {
          extend: {
            borderRadius: {
              md: "var(--radius-inner, var(--dg-radii-inner))"
            }
          }
        }
      };
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
:root {
  --dg-color-text-low-emphasis: rgba(255, 255, 255, 0.38);
  --dg-color-text-high-emphasis: #FFFFFF;
  --dg-color-text-medium-emphasis: rgba(255, 255, 255, 0.60);
  --dg-color-action-primary: #4ADE80;
  --dg-color-border-divider: rgba(255, 255, 255, 0.08);
  --dg-color-surface-card: rgba(255, 255, 255, 0.05);
  --dg-color-background-primary: #0A0A0A;
  --dg-radii-inner: 11px;
  --dg-gradients-app-background: radial-gradient(circle at 80% 10%, rgba(74, 222, 128, 0.15) 0%, rgba(10, 10, 10, 1) 60%);
  --dg-typography-heading-font-family: SF Pro Display, Inter, system-ui, sans-serif;
  --dg-typography-body-font-family: SF Pro Display, Inter, system-ui, sans-serif;
  --dg-mobile-layout-section-gap: 40px;
  --dg-mobile-layout-safe-area-top: 16px;
  --dg-mobile-layout-screen-margin: 24px;
  --radius-inner: var(--dg-radii-inner, 12px);
}

:where(#root, #drawgle-export-root) h1,
:where(#root, #drawgle-export-root) h2,
:where(#root, #drawgle-export-root) h3,
:where(#root, #drawgle-export-root) h4,
:where(#root, #drawgle-export-root) h5,
:where(#root, #drawgle-export-root) h6 {
  font-family: var(--dg-typography-heading-font-family, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif);
}

:where(#root, #drawgle-export-root) button,
:where(#root, #drawgle-export-root) input,
:where(#root, #drawgle-export-root) textarea,
:where(#root, #drawgle-export-root) select {
  font-family: var(--dg-typography-body-font-family, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif);
}

.dg-bg-primary { background-color: var(--dg-color-background-primary); }

.dg-surface-card { background-color: var(--dg-color-surface-card); }

.dg-text-high { color: var(--dg-color-text-high-emphasis); }
html, body { margin: 0; min-height: 100%; }
body {
  font-family: var(--dg-typography-body-font-family, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif);
  background: var(--dg-color-background-primary, #ffffff);
  color: var(--dg-color-text-high-emphasis, #111827);
}
#drawgle-export-root {
  position: relative;
  min-height: 100vh;
  overflow-x: hidden;
  background: var(--dg-color-background-primary, #ffffff);
}
    </style>
  </head>
  <body>
    <div id="drawgle-export-root">
<div class="w-full min-h-screen dg-bg-primary dg-text-high flex flex-col relative overflow-x-hidden" style="font-family: var(--dg-typography-body-font-family, SF Pro Display, Inter, system-ui, sans-serif); background-image: var(--dg-gradients-app-background);">
  
  <!-- Header Section -->
  <header class="pt-[var(--dg-mobile-layout-safe-area-top)] px-[var(--dg-mobile-layout-screen-margin)] flex items-center justify-between mt-4">
    <div class="flex items-center gap-3">
      <!-- Circular Progress Ring -->
      <div class="relative w-10 h-10 flex items-center justify-center">
        <svg class="w-full h-full transform -rotate-90">
          <circle cx="20" cy="20" r="18" stroke="rgba(255,255,255,0.1)" stroke-width="3" fill="none" />
          <circle cx="20" cy="20" r="18" stroke="var(--dg-color-action-primary)" stroke-width="3" fill="none" stroke-dasharray="113" stroke-dashoffset="36" stroke-linecap="round" />
        </svg>
        <span class="absolute text-[12px] font-bold">68</span>
      </div>
      <!-- Date Display -->
      <div class="flex items-baseline gap-2">
        <span class="text-[26px] font-bold leading-none">26</span>
        <span class="text-[26px] font-medium text-[var(--dg-color-text-medium-emphasis)] leading-none">Sunday</span>
      </div>
    </div>
    <!-- Menu Icon -->
    <div class="w-10 h-10 flex items-center justify-end">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="4" y1="12" x2="20" y2="12"></line>
        <line x1="4" y1="6" x2="20" y2="6"></line>
      </svg>
    </div>
  </header>

  <!-- Calendar Strip -->
  <section class="mt-[var(--dg-mobile-layout-section-gap)] px-[var(--dg-mobile-layout-screen-margin)]">
    <div class="flex justify-between items-center">
      <!-- Day Item -->
      <div class="flex flex-col items-center gap-2">
        <span class="text-[11px] font-medium text-[var(--dg-color-text-low-emphasis)] uppercase tracking-wider">M</span>
        <span class="text-[14px] font-semibold text-[var(--dg-color-text-medium-emphasis)]">21</span>
      </div>
      <!-- Day Item -->
      <div class="flex flex-col items-center gap-2">
        <span class="text-[11px] font-medium text-[var(--dg-color-text-low-emphasis)] uppercase tracking-wider">T</span>
        <span class="text-[14px] font-semibold text-[var(--dg-color-text-medium-emphasis)]">22</span>
      </div>
      <!-- Day Item -->
      <div class="flex flex-col items-center gap-2">
        <span class="text-[11px] font-medium text-[var(--dg-color-text-low-emphasis)] uppercase tracking-wider">W</span>
        <span class="text-[14px] font-semibold text-[var(--dg-color-text-medium-emphasis)]">23</span>
      </div>
      <!-- Day Item -->
      <div class="flex flex-col items-center gap-2">
        <span class="text-[11px] font-medium text-[var(--dg-color-text-low-emphasis)] uppercase tracking-wider">T</span>
        <span class="text-[14px] font-semibold text-[var(--dg-color-text-medium-emphasis)]">24</span>
      </div>
      <!-- Day Item -->
      <div class="flex flex-col items-center gap-2">
        <span class="text-[11px] font-medium text-[var(--dg-color-text-low-emphasis)] uppercase tracking-wider">F</span>
        <span class="text-[14px] font-semibold text-[var(--dg-color-text-medium-emphasis)]">25</span>
      </div>
      <!-- Active Day Item -->
      <div class="flex flex-col items-center gap-2 relative">
        <span class="text-[11px] font-medium text-[var(--dg-color-action-primary)] uppercase tracking-wider">S</span>
        <div class="w-10 h-10 dg-surface-card rounded-[12px] flex items-center justify-center border border-[var(--dg-color-border-divider)]">
          <span class="text-[14px] font-bold text-white">26</span>
        </div>
        <div class="absolute -bottom-2 w-1 h-1 bg-red-500 rounded-full"></div>
      </div>
      <!-- Day Item -->
      <div class="flex flex-col items-center gap-2">
        <span class="text-[11px] font-medium text-[var(--dg-color-text-low-emphasis)] uppercase tracking-wider">S</span>
        <span class="text-[14px] font-semibold text-[var(--dg-color-text-medium-emphasis)]">27</span>
      </div>
    </div>
  </section>

  <!-- Weather/Location -->
  <section class="mt-8 px-[var(--dg-mobile-layout-screen-margin)] flex items-center gap-2">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-[var(--dg-color-text-medium-emphasis)]">
      <path d="M17.5 19c.7 0 1.2-.6 1.2-1.2V11l-5.5-5.5L7.7 11v6.8c0 .7.5 1.2 1.2 1.2h8.6Z"></path>
      <path d="M12 13v3"></path>
    </svg>
    <span class="text-[16px] font-bold">6°</span>
    <span class="text-[14px] text-[var(--dg-color-text-medium-emphasis)] flex items-center gap-1">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 11 19-9-9 19-2-8-8-2Z"></path></svg>
      Krakow
    </span>
  </section>

  <!-- Summary Block -->
  <section class="mt-4 px-[var(--dg-mobile-layout-screen-margin)]">
    <h1 class="text-[28px] font-bold leading-[1.2] tracking-tight">
      Good morning.<br>
      You have 
      <span class="inline-flex items-center align-middle mx-1 px-2 py-0.5 rounded-md bg-white/10 border border-white/10">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="mr-1"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
        2 events,
      </span><br>
      <span class="inline-flex items-center align-middle mr-1 px-2 py-0.5 rounded-md bg-white/10 border border-white/10">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="mr-1"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
        2 meetings
      </span> and<br>
      <span class="inline-flex items-center align-middle mr-1 px-2 py-0.5 rounded-md bg-white/10 border border-white/10">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="mr-1"><polyline points="9 11 12 14 22 4"></polyline><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path></svg>
        3 tasks
      </span> today.
    </h1>
  </section>

  <!-- Status Chips -->
  <section class="mt-6 px-[var(--dg-mobile-layout-screen-margin)] flex gap-2 overflow-x-auto no-scrollbar">
    <button class="flex items-center gap-2 px-4 py-2 rounded-full bg-white/5 border border-white/10 whitespace-nowrap">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path></svg>
      <span class="text-[13px] font-medium">Great</span>
    </button>
    <button class="flex items-center gap-2 px-4 py-2 rounded-full bg-white/5 border border-white/10 whitespace-nowrap">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 12h-4l-3 9L9 3l-3 9H2"></path></svg>
      <span class="text-[13px] font-medium">Typical</span>
    </button>
    <button class="flex items-center gap-2 px-4 py-2 rounded-full bg-white/5 border border-white/10 whitespace-nowrap">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"></path></svg>
      <span class="text-[13px] font-medium">Good</span>
    </button>
  </section>

  <!-- Task List -->
  <section class="mt-[var(--dg-mobile-layout-section-gap)] px-[var(--dg-mobile-layout-screen-margin)] flex flex-col gap-6 pb-32">
    
    <!-- Task Row 1 -->
    <div class="flex gap-4 items-start">
      <div class="w-10 h-10 rounded-[10px] bg-[#2D4A3E] flex items-center justify-center flex-shrink-0 border border-white/10">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--dg-color-action-primary)" stroke-width="2"><polyline points="9 11 12 14 22 4"></polyline><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path></svg>
      </div>
      <div class="flex flex-col gap-1">
        <p class="text-[15px] font-semibold leading-tight">Finish onboarding <span class="text-[var(--dg-color-text-low-emphasis)] font-normal">was overdue and rescheduled from yesterday</span></p>
      </div>
    </div>

    <!-- Task Row 2 -->
    <div class="flex gap-4 items-start">
      <div class="w-10 h-10 rounded-[10px] bg-[#2D4A3E] flex items-center justify-center flex-shrink-0 border border-white/10">
        <div class="relative">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--dg-color-action-primary)" stroke-width="2"><path d="M12 5v14M5 12h14"></path></svg>
        </div>
      </div>
      <div class="flex flex-col gap-1">
        <p class="text-[15px] font-semibold leading-tight">Order protein and book flight tickets <span class="text-[var(--dg-color-text-low-emphasis)] font-normal">were auto-scheduled from to do</span></p>
      </div>
    </div>

    <!-- Task Row 3 (Faded/Masked) -->
    <div class="flex gap-4 items-start opacity-40">
      <div class="w-10 h-10 rounded-[10px] bg-white/5 flex items-center justify-center flex-shrink-0 border border-white/10">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="16"></line><line x1="8" y1="12" x2="16" y2="12"></line></svg>
      </div>
      <div class="flex flex-col gap-1">
        <p class="text-[15px] font-semibold leading-tight">Exoplan Discussion <span class="text-[var(--dg-color-text-low-emphasis)] font-normal">new invite</span></p>
      </div>
    </div>

    <!-- Secondary Action -->
    <div class="flex justify-center mt-4">
      <button class="px-6 py-2.5 rounded-full bg-white/10 border border-white/10 text-[14px] font-semibold">
        Open Activity
      </button>
    </div>
  </section>

  <!-- Floating Action Button -->
  <div class="fixed bottom-8 left-0 right-0 flex justify-center pointer-events-none">
    <div class="relative pointer-events-auto">
      <!-- Glow Effect -->
      <div class="absolute inset-0 bg-[var(--dg-color-action-primary)] blur-xl opacity-30 rounded-full"></div>
      <button class="relative w-[72px] h-[44px] rounded-full bg-[#1A1A1A] border border-white/20 flex items-center justify-center shadow-2xl">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
      </button>
    </div>
  </div>

  <!-- Bottom Gradient Mask for Scroll -->
  <div class="fixed bottom-0 left-0 right-0 h-32 bg-gradient-to-t from-[var(--dg-color-background-primary)] to-transparent pointer-events-none"></div>

</div>
      
    </div>
    <script>
      function drawgleRepairLucideNames(root) {
  var icons = window.lucide && window.lucide.icons;
  if (!icons) return 0;
  var byLetters = null;
  var repaired = 0;
  (root || document).querySelectorAll("[data-lucide]").forEach(function (node) {
    var name = node.getAttribute("data-lucide") || "";
    var key = name.replace(/^([A-Z])|[\s\-_]+(\w)/g, function (match, first, next) { return next ? next.toUpperCase() : first.toLowerCase(); });
    key = key.charAt(0).toUpperCase() + key.slice(1);
    if (icons[key]) return;
    if (!byLetters) {
      byLetters = {};
      Object.keys(icons).forEach(function (iconKey) { byLetters[iconKey.toLowerCase()] = iconKey; });
    }
    var match = byLetters[name.replace(/[^a-z0-9]/gi, "").toLowerCase()];
    if (match) {
      node.setAttribute("data-lucide", match);
      repaired += 1;
    }
  });
  return repaired;
}
      if (window.lucide && typeof window.lucide.createIcons === "function") { drawgleRepairLucideNames(); window.lucide.createIcons(); }
    </script>
  </body>
</html>
