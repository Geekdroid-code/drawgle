<div class="w-full min-h-screen dg-bg-primary dg-text-high flex flex-col relative overflow-x-hidden">
  
  <!-- Header Profile Region -->
  <header id="header-profile" class="pt-[16px] px-[16px] flex items-center justify-between shrink-0 bg-[var(--dg-color-background-primary)] z-10">
    <div class="flex items-center gap-[12px]">
      <div class="w-[44px] h-[44px] rounded-full bg-black flex items-center justify-center shrink-0">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#D4FF4D" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
          <circle cx="12" cy="7" r="4"></circle>
        </svg>
      </div>
      <div class="flex flex-col">
        <span class="dg-type-supporting dg-text-medium">Good morning,</span>
        <span class="dg-type-section-title">Alex</span>
      </div>
    </div>
    
    <div class="flex items-center gap-[8px]">
      <div class="flex items-center gap-[6px] px-[12px] py-[6px] rounded-full dg-action-primary">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"></path>
        </svg>
        <span class="dg-type-caption font-bold">12</span>
      </div>
      <button class="w-[40px] h-[40px] rounded-full dg-surface-card dg-shadow-surface flex items-center justify-center">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
      </button>
    </div>
  </header>

  <!-- Scrollable Content -->
  <main class="flex-1 overflow-y-auto px-[16px] py-[24px] flex flex-col gap-[24px]">
    
    <!-- Hero Metrics Region -->
    <section id="hero-metrics" class="dg-surface-card dg-radius-app dg-shadow-surface p-[20px] flex flex-col gap-[20px]">
      <div class="flex justify-between items-start">
        <div>
          <div class="dg-type-metric-value text-[40px] leading-[40px]">24</div>
          <div class="dg-type-supporting dg-text-medium mt-[6px]">Workouts Completed</div>
        </div>
        <div class="w-[48px] h-[48px] rounded-full bg-[#FF5C33] bg-opacity-10 flex items-center justify-center text-[#FF5C33] shrink-0">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"></path>
            <path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"></path>
            <path d="M4 22h16"></path>
            <path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"></path>
            <path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"></path>
            <path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"></path>
          </svg>
        </div>
      </div>
      
      <div class="flex gap-[12px] pt-[16px] border-t border-[var(--dg-color-border-divider)]">
        <div class="flex-1 min-w-0">
          <div class="dg-type-caption dg-text-low">Weekly Volume</div>
          <div class="dg-type-section-title truncate">12.4k <span class="dg-type-supporting font-normal dg-text-low">kg</span></div>
        </div>
        <div class="flex-1 min-w-0">
          <div class="dg-type-caption dg-text-low">Intensity</div>
          <div class="dg-type-section-title truncate">High</div>
        </div>
        <div class="flex-1 min-w-0">
          <div class="dg-type-caption dg-text-low">Duration</div>
          <div class="dg-type-section-title truncate">45 <span class="dg-type-supporting font-normal dg-text-low">min</span></div>
        </div>
      </div>
      
      <button class="w-full pt-[8px] flex items-center justify-center gap-[6px] dg-type-caption dg-text-low hover:opacity-70 transition-opacity">
        <span>Tap to expand today's exercises</span>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="m6 9 6 6 6-6"></path>
        </svg>
      </button>
    </section>

    <!-- Daily Focus Region -->
    <section id="daily-focus" class="flex flex-col gap-[12px]">
      <div class="flex items-center justify-between px-[4px]">
        <h2 class="dg-type-section-title">Today's Focus</h2>
        <button class="dg-type-supporting dg-text-medium hover:text-black transition-colors">View All</button>
      </div>
      
      <div class="flex gap-[12px] overflow-x-auto -mx-[16px] px-[16px] pb-[4px]">
        <!-- Skill Card 1 -->
        <div class="shrink-0 w-[148px] dg-surface-card dg-radius-inner p-[16px] flex flex-col gap-[12px] dg-shadow-surface border border-[var(--dg-color-border-divider)]">
          <div class="w-[40px] h-[40px] rounded-full bg-black flex items-center justify-center text-[#D4FF4D]">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M6.5 6.5h11"></path>
              <path d="M6.5 17.5h11"></path>
              <path d="M6 20v-2a6 6 0 1 1 12 0v2"></path>
              <path d="m9 9 6 6"></path>
              <path d="m15 9-6 6"></path>
            </svg>
          </div>
          <div class="min-w-0">
            <div class="dg-type-supporting font-bold truncate">Muscle-ups</div>
            <div class="dg-type-caption dg-text-low mt-[2px]">5 sets × 3 reps</div>
          </div>
          <div class="h-[4px] w-full bg-[var(--dg-color-border-divider)] rounded-full overflow-hidden mt-[4px]">
            <div class="h-full w-[60%] bg-black rounded-full"></div>
          </div>
        </div>

        <!-- Skill Card 2 -->
        <div class="shrink-0 w-[148px] dg-surface-card dg-radius-inner p-[16px] flex flex-col gap-[12px] dg-shadow-surface border border-[var(--dg-color-border-divider)]">
          <div class="w-[40px] h-[40px] rounded-full bg-black flex items-center justify-center text-[#D4FF4D]">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 2v20"></path>
              <path d="m2 12 20 0"></path>
              <path d="m4.93 4.93 14.14 14.14"></path>
              <path d="m19.07 4.93-14.14 14.14"></path>
            </svg>
          </div>
          <div class="min-w-0">
            <div class="dg-type-supporting font-bold truncate">Front Lever</div>
            <div class="dg-type-caption dg-text-low mt-[2px]">4 sets × 10s</div>
          </div>
          <div class="h-[4px] w-full bg-[var(--dg-color-border-divider)] rounded-full overflow-hidden mt-[4px]">
            <div class="h-full w-[40%] bg-black rounded-full"></div>
          </div>
        </div>

        <!-- Skill Card 3 -->
        <div class="shrink-0 w-[148px] dg-surface-card dg-radius-inner p-[16px] flex flex-col gap-[12px] dg-shadow-surface border border-[var(--dg-color-border-divider)]">
          <div class="w-[40px] h-[40px] rounded-full bg-black flex items-center justify-center text-[#D4FF4D]">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <rect x="2" y="6" width="20" height="12" rx="2"></rect>
              <path d="M12 12h.01"></path>
            </svg>
          </div>
          <div class="min-w-0">
            <div class="dg-type-supporting font-bold truncate">Planche</div>
            <div class="dg-type-caption dg-text-low mt-[2px]">3 sets × 5s</div>
          </div>
          <div class="h-[4px] w-full bg-[var(--dg-color-border-divider)] rounded-full overflow-hidden mt-[4px]">
            <div class="h-full w-[25%] bg-black rounded-full"></div>
          </div>
        </div>

        <!-- Skill Card 4 -->
        <div class="shrink-0 w-[148px] dg-surface-card dg-radius-inner p-[16px] flex flex-col gap-[12px] dg-shadow-surface border border-[var(--dg-color-border-divider)]">
          <div class="w-[40px] h-[40px] rounded-full bg-[var(--dg-color-background-primary)] flex items-center justify-center text-black border border-[var(--dg-color-border-divider)]">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M5 12h14"></path>
              <path d="M12 5v14"></path>
            </svg>
          </div>
          <div class="min-w-0">
            <div class="dg-type-supporting font-bold truncate">Add Skill</div>
            <div class="dg-type-caption dg-text-low mt-[2px]">Custom exercise</div>
          </div>
        </div>
      </div>
    </section>

    <!-- Secondary Stats -->
    <section class="flex flex-col gap-[12px]">
      <h2 class="dg-type-section-title px-[4px]">Weekly Progress</h2>
      <div class="dg-surface-card dg-radius-app p-[16px] flex items-center justify-between dg-shadow-surface border border-[var(--dg-color-border-divider)]">
        <div class="flex items-center gap-[12px] min-w-0">
          <div class="w-[48px] h-[48px] rounded-full bg-[var(--dg-color-action-primary)] bg-opacity-20 flex items-center justify-center text-black shrink-0">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
              <line x1="16" y1="2" x2="16" y2="6"></line>
              <line x1="8" y1="2" x2="8" y2="6"></line>
              <line x1="3" y1="10" x2="21" y2="10"></line>
            </svg>
          </div>
          <div class="min-w-0">
            <div class="dg-type-supporting font-bold truncate">Consistency Score</div>
            <div class="dg-type-caption dg-text-low truncate">You're on fire this week</div>
          </div>
        </div>
        <div class="dg-type-section-title text-[#D4FF4D] drop-shadow-sm ml-[12px]">94%</div>
      </div>
    </section>
    
    <!-- Bottom spacer for scroll clearance -->
    <div class="h-[8px]"></div>
  </main>

  <!-- Primary Action Region -->
  <div id="primary-action" class="shrink-0 p-[16px] bg-gradient-to-t from-[var(--dg-color-background-primary)] via-[var(--dg-color-background-primary)] to-transparent">
    <button class="w-full h-[56px] dg-gradient-action-primary dg-radius-inner dg-type-button-label text-black flex items-center justify-center gap-[8px] shadow-[0_4px_20px_rgba(212,255,77,0.3)] active:scale-[0.98] transition-transform">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" stroke="none">
        <polygon points="5 3 19 12 5 21 5 3"></polygon>
      </svg>
      Start Workout
    </button>
  </div>

</div>
