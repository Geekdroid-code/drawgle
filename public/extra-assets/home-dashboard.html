<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Home Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link id="drawgle-google-font" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700&amp;display=swap">
    <style>
:root {
  --dg-color-text-high-emphasis: #FFFFFF;
  --dg-color-text-medium-emphasis: #8E8E93;
  --dg-color-surface-card: #1C1C1C;
  --dg-color-background-primary: #F2F2F2;
  --dg-color-background-secondary: #FFFFFF;
  --dg-radii-inner: 24px;
  --dg-shadows-overlay: 0px 10px 40px rgba(0, 0, 0, 0.15);
  --dg-spacing-md: 16px;
  --dg-spacing-xl: 32px;
  --dg-spacing-xs: 8px;
  --dg-typography-heading-font-family: Inter, -apple-system, sans-serif;
  --dg-typography-body-font-family: "SF Pro Display", sans-serif;
  --dg-type-section-title-size: 16px;
  --dg-type-section-title-weight: 600;
  --dg-type-section-title-line-height: 22px;
  --dg-type-body-size: 14px;
  --dg-type-body-weight: 400;
  --dg-type-body-line-height: 20px;
  --dg-type-supporting-size: 12px;
  --dg-type-supporting-weight: 500;
  --dg-type-supporting-line-height: 16px;
  --dg-type-caption-size: 11px;
  --dg-type-caption-weight: 400;
  --dg-type-caption-line-height: 14px;
  --dg-type-button-label-size: 14px;
  --dg-type-button-label-weight: 600;
  --dg-type-button-label-line-height: 18px;
  --dg-mobile-layout-element-gap: 16px;
  --dg-mobile-layout-section-gap: 32px;
  --dg-mobile-layout-safe-area-top: 16px;
  --dg-mobile-layout-screen-margin: 16px;
}

:where(#root, #drawgle-export-root) h1,
:where(#root, #drawgle-export-root) h2,
:where(#root, #drawgle-export-root) h3,
:where(#root, #drawgle-export-root) h4,
:where(#root, #drawgle-export-root) h5,
:where(#root, #drawgle-export-root) h6 {
  font-family: var(--dg-typography-heading-font-family, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif);
}

:where(#root, #drawgle-export-root) button,
:where(#root, #drawgle-export-root) input,
:where(#root, #drawgle-export-root) textarea,
:where(#root, #drawgle-export-root) select {
  font-family: var(--dg-typography-body-font-family, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif);
}

.dg-bg-primary { background-color: var(--dg-color-background-primary); }

.dg-bg-secondary { background-color: var(--dg-color-background-secondary); }

.dg-text-high { color: var(--dg-color-text-high-emphasis); }

.dg-type-section-title {
  font-family: var(--dg-typography-heading-font-family, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif);
  font-size: var(--dg-type-section-title-size);
  font-weight: var(--dg-type-section-title-weight);
  line-height: var(--dg-type-section-title-line-height);
}

.dg-type-body {
  font-family: var(--dg-typography-body-font-family, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif);
  font-size: var(--dg-type-body-size);
  font-weight: var(--dg-type-body-weight);
  line-height: var(--dg-type-body-line-height);
}

.dg-type-supporting {
  font-family: var(--dg-typography-body-font-family, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif);
  font-size: var(--dg-type-supporting-size);
  font-weight: var(--dg-type-supporting-weight);
  line-height: var(--dg-type-supporting-line-height);
}

.dg-type-caption {
  font-family: var(--dg-typography-body-font-family, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif);
  font-size: var(--dg-type-caption-size);
  font-weight: var(--dg-type-caption-weight);
  line-height: var(--dg-type-caption-line-height);
}

.dg-type-button-label {
  font-family: var(--dg-typography-body-font-family, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif);
  font-size: var(--dg-type-button-label-size);
  font-weight: var(--dg-type-button-label-weight);
  line-height: var(--dg-type-button-label-line-height);
}
html, body { margin: 0; min-height: 100%; }
body {
  font-family: var(--dg-typography-body-font-family, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif);
  background: var(--dg-color-background-primary, #ffffff);
  color: var(--dg-color-text-high-emphasis, #111827);
}
#drawgle-export-root {
  position: relative;
  min-height: 100vh;
  overflow-x: hidden;
  background: var(--dg-color-background-primary, #ffffff);
}
    </style>
  </head>
  <body>
    <div id="drawgle-export-root">
<div class="w-full min-h-screen dg-bg-primary dg-text-high flex flex-col relative overflow-x-hidden">
  <!-- Top Dark Island Container -->
  <div class="w-full dg-bg-secondary pt-[var(--dg-mobile-layout-safe-area-top)] pb-[var(--dg-mobile-layout-section-gap)] rounded-b-[40px] bg-[var(--dg-color-surface-card)] relative z-10">
    <div class="px-[var(--dg-mobile-layout-screen-margin)] flex flex-col items-center">
      
      <!-- Header Row -->
      <div class="w-full flex justify-between items-center mb-[var(--dg-mobile-layout-section-gap)]">
        <div class="flex items-center gap-[var(--dg-spacing-xs)]">
          <div class="w-10 h-10 rounded-full bg-[#2C2C2E] overflow-hidden flex items-center justify-center border border-white/10">
            <!-- Avatar Placeholder -->
            <div class="w-full h-full bg-gradient-to-br from-gray-400 to-gray-600"></div>
          </div>
          <span class="dg-type-body font-medium text-white">Good morning!</span>
        </div>
        <button class="w-10 h-10 rounded-full border border-white/10 flex items-center justify-center text-white">
          <i data-lucide="bell" class="w-5 h-5"></i>
        </button>
      </div>

      <!-- Total Balance Section -->
      <div class="flex flex-col items-center mb-[var(--dg-mobile-layout-section-gap)]">
        <span class="dg-type-supporting text-[var(--dg-color-text-medium-emphasis)] mb-1">Total Balance</span>
        <div class="flex items-baseline">
          <span class="text-[40px] font-bold text-white tracking-tight">$30,890</span>
          <span class="text-[24px] font-bold text-white/60">.60</span>
        </div>
      </div>

      <!-- Action Row -->
      <div class="flex gap-[var(--dg-spacing-xl)] mb-[var(--dg-mobile-layout-section-gap)]">
        <div class="flex flex-col items-center gap-2">
          <button class="w-12 h-12 rounded-full border border-white/10 flex items-center justify-center text-white">
            <i data-lucide="plus" class="w-6 h-6"></i>
          </button>
          <span class="dg-type-caption text-white/80">Add</span>
        </div>
        <div class="flex flex-col items-center gap-2">
          <button class="w-12 h-12 rounded-full bg-white flex items-center justify-center text-[var(--dg-color-surface-card)]">
            <i data-lucide="arrow-up-right" class="w-6 h-6"></i>
          </button>
          <span class="dg-type-caption text-white/80">Send</span>
        </div>
        <div class="flex flex-col items-center gap-2">
          <button class="w-12 h-12 rounded-full border border-white/10 flex items-center justify-center text-white">
            <i data-lucide="more-horizontal" class="w-6 h-6"></i>
          </button>
          <span class="dg-type-caption text-white/80">More</span>
        </div>
      </div>

      <!-- Money Flow Cards -->
      <div class="w-full grid grid-cols-2 gap-[var(--dg-mobile-layout-element-gap)]">
        <!-- Money In -->
        <div class="bg-[#2C2C2E] p-[var(--dg-spacing-md)] rounded-[var(--dg-radii-inner)] flex flex-col gap-4">
          <div class="flex items-center gap-2">
            <div class="w-6 h-6 rounded-full bg-[var(--dg-color-surface-card)] flex items-center justify-center">
              <i data-lucide="arrow-down-left" class="w-3 h-3 text-green-400"></i>
            </div>
            <span class="dg-type-supporting text-white/60">Money In</span>
          </div>
          <span class="dg-type-section-title text-white">$9,080.00</span>
        </div>
        <!-- Money Out -->
        <div class="bg-[#2C2C2E] p-[var(--dg-spacing-md)] rounded-[var(--dg-radii-inner)] flex flex-col gap-4">
          <div class="flex items-center gap-2">
            <div class="w-6 h-6 rounded-full bg-[var(--dg-color-surface-card)] flex items-center justify-center">
              <i data-lucide="arrow-up-right" class="w-3 h-3 text-red-400"></i>
            </div>
            <span class="dg-type-supporting text-white/60">Money Out</span>
          </div>
          <span class="dg-type-section-title text-white">$3,080.00</span>
        </div>
      </div>

    </div>
  </div>

  <!-- Transaction History Section -->
  <div class="flex-1 px-[var(--dg-mobile-layout-screen-margin)] pt-[var(--dg-mobile-layout-section-gap)] pb-[100px]">
    <div class="flex justify-between items-center mb-[var(--dg-mobile-layout-element-gap)]">
      <h2 class="dg-type-section-title text-[var(--dg-color-surface-card)]">Transaction History</h2>
      <button class="dg-type-supporting text-red-400 font-semibold">See all</button>
    </div>

    <div class="flex flex-col gap-[var(--dg-mobile-layout-element-gap)]">
      <!-- Transaction Item 1 -->
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-3">
          <div class="w-11 h-11 rounded-full bg-gray-200 overflow-hidden flex items-center justify-center">
            <div class="w-full h-full bg-gradient-to-tr from-blue-100 to-blue-300"></div>
          </div>
          <div class="flex flex-col">
            <span class="dg-type-body font-semibold text-[var(--dg-color-surface-card)]">Transfer to Nahim</span>
            <span class="dg-type-caption text-[var(--dg-color-text-medium-emphasis)]">Sun 02, 2026</span>
          </div>
        </div>
        <div class="flex flex-col items-end">
          <span class="dg-type-body font-bold text-[var(--dg-color-surface-card)]">$1,090.00</span>
          <span class="dg-type-caption text-[var(--dg-color-text-medium-emphasis)]">Successful</span>
        </div>
      </div>

      <!-- Transaction Item 2 -->
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-3">
          <div class="w-11 h-11 rounded-full bg-gray-200 overflow-hidden flex items-center justify-center">
            <div class="w-full h-full bg-gradient-to-tr from-orange-100 to-orange-300"></div>
          </div>
          <div class="flex flex-col">
            <span class="dg-type-body font-semibold text-[var(--dg-color-surface-card)]">Transfer to Ayomide</span>
            <span class="dg-type-caption text-[var(--dg-color-text-medium-emphasis)]">Sun 02, 2026</span>
          </div>
        </div>
        <div class="flex flex-col items-end">
          <span class="dg-type-body font-bold text-[var(--dg-color-surface-card)]">$690.00</span>
          <span class="dg-type-caption text-[var(--dg-color-text-medium-emphasis)]">Successful</span>
        </div>
      </div>

      <!-- Transaction Item 3 -->
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-3">
          <div class="w-11 h-11 rounded-full bg-gray-200 overflow-hidden flex items-center justify-center">
            <div class="w-full h-full bg-gradient-to-tr from-blue-100 to-blue-300"></div>
          </div>
          <div class="flex flex-col">
            <span class="dg-type-body font-semibold text-[var(--dg-color-surface-card)]">Transfer to Nahim</span>
            <span class="dg-type-caption text-[var(--dg-color-text-medium-emphasis)]">Sun 02, 2026</span>
          </div>
        </div>
        <div class="flex flex-col items-end">
          <span class="dg-type-body font-bold text-[var(--dg-color-surface-card)]">$1,090.00</span>
          <span class="dg-type-caption text-[var(--dg-color-text-medium-emphasis)]">Successful</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Bottom Navigation -->
  <div class="fixed bottom-6 left-1/2 -translate-x-1/2 w-[calc(100%-32px)] max-w-[358px] h-[64px] bg-white rounded-full shadow-[var(--dg-shadows-overlay)] flex items-center justify-between px-2 z-50">
    <button class="flex items-center gap-2 bg-[var(--dg-color-surface-card)] text-white h-[48px] px-5 rounded-full">
      <i data-lucide="home" class="w-5 h-5"></i>
      <span class="dg-type-button-label">Home</span>
    </button>
    <button class="flex flex-col items-center justify-center w-14 h-14 text-[var(--dg-color-text-medium-emphasis)]">
      <i data-lucide="credit-card" class="w-5 h-5"></i>
      <span class="dg-type-caption mt-1">Cards</span>
    </button>
    <button class="flex flex-col items-center justify-center w-14 h-14 text-[var(--dg-color-text-medium-emphasis)]">
      <i data-lucide="bar-chart-3" class="w-5 h-5"></i>
      <span class="dg-type-caption mt-1">Stats</span>
    </button>
    <button class="flex flex-col items-center justify-center w-14 h-14 text-[var(--dg-color-text-medium-emphasis)]">
      <i data-lucide="user" class="w-5 h-5"></i>
      <span class="dg-type-caption mt-1">Profile</span>
    </button>
  </div>

</div>
      
    </div>
    <script>
      function drawgleRepairLucideNames(root) {
  var icons = window.lucide && window.lucide.icons;
  if (!icons) return 0;
  var byLetters = null;
  var repaired = 0;
  (root || document).querySelectorAll("[data-lucide]").forEach(function (node) {
    var name = node.getAttribute("data-lucide") || "";
    var key = name.replace(/^([A-Z])|[\s\-_]+(\w)/g, function (match, first, next) { return next ? next.toUpperCase() : first.toLowerCase(); });
    key = key.charAt(0).toUpperCase() + key.slice(1);
    if (icons[key]) return;
    if (!byLetters) {
      byLetters = {};
      Object.keys(icons).forEach(function (iconKey) { byLetters[iconKey.toLowerCase()] = iconKey; });
    }
    var match = byLetters[name.replace(/[^a-z0-9]/gi, "").toLowerCase()];
    if (match) {
      node.setAttribute("data-lucide", match);
      repaired += 1;
    }
  });
  return repaired;
}
      if (window.lucide && typeof window.lucide.createIcons === "function") { drawgleRepairLucideNames(); window.lucide.createIcons(); }
    </script>
  </body>
</html>
